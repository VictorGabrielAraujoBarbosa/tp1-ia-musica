<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reactive Race Music — Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>Reactive Race Music</h1>
      <p class="sub" id="bundleSub">scripted race recording → generative music</p>
    </div>
    <nav id="bundlePicker" class="picker" aria-label="Race"></nav>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>Race progress</h2>
        <span class="mono dim" id="clock">—</span>
      </div>
      <div id="lanes" class="lanes"></div>
      <div class="readouts">
        <div class="readout"><span class="k">Gap (you − opp)</span><span class="v mono" id="gapValue">—</span></div>
        <div class="readout"><span class="k">Police distance</span><span class="v mono" id="policeValue">—</span></div>
        <div class="readout"><span class="k">Race phase</span><span class="v mono" id="phaseValue">—</span></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Music state</h2>
        <span class="mono dim" id="barInfo"></span>
      </div>
      <div class="state-row">
        <div class="state-block">
          <div class="meter-badge" id="meterBadge">4/4</div>
          <div class="caption">meter</div>
        </div>
        <div class="state-block grow">
          <div class="tension-labels"><span>tension</span><span class="mono dim" id="tensionValue">0.00</span></div>
          <div class="tension-track"><div class="tension-fill" id="tensionBar"></div></div>
        </div>
        <div class="state-block">
          <ul class="layers" id="layers" aria-label="Layers"></ul>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Telemetry</h2>
        <span class="legend">
          <i class="dot you"></i>You
          <i class="dot opp"></i>Opponent
          <i class="dot police"></i>Police
        </span>
      </div>
      <canvas id="chart"></canvas>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Audio</h2>
        <button class="ghost" id="scopeToggle" type="button">Waveform</button>
      </div>
      <canvas id="scope"></canvas>
    </section>
  </main>

  <footer class="transport">
    <button id="playButton" class="primary" type="button">Play</button>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
    <span class="mono dim" id="timeLabel">0:00 / 0:00</span>
    <button id="replayButton" class="ghost" type="button">Replay</button>
  </footer>

  <audio id="audio" preload="auto"></audio>
  <script src="viz.js"></script>
</body>
</html>
